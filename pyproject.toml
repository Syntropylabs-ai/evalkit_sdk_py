[build-system]
requires = ["hatchling", "python-minifier>=2.9.0"]
build-backend = "hatchling.build"

[project]
name = "syntropylabs-evalkit"
version = "0.3.6"
description = "EvalKit Python SDK — LLM observability and tracing"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Syntropy Labs" }]
keywords = ["llm", "observability", "tracing", "evaluation", "opentelemetry", "llm-as-judge", "agents", "claude-code", "openai", "anthropic", "ai"]
dependencies = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.41b0",
    "opentelemetry-instrumentation-urllib3>=0.41b0",
    "opentelemetry-instrumentation-redis>=0.41b0",
    "opentelemetry-instrumentation-pymongo>=0.41b0",
    "opentelemetry-instrumentation-psycopg>=0.41b0",
    "opentelemetry-instrumentation-asyncpg>=0.41b0",
    "opentelemetry-instrumentation-pymysql>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-flask>=0.41b0",
    "opentelemetry-instrumentation-asgi>=0.41b0",
    "opentelemetry-instrumentation-wsgi>=0.41b0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
evalkit = "evalkit_cli.main:main"

[project.urls]
Homepage = "https://syntropylabs.ai"
Documentation = "https://syntropylabs.ai/docs"
Integrations = "https://syntropylabs.ai/integrations"

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
google = ["google-genai>=0.3.0"]
cohere = ["cohere>=5.0.0"]
mistral = ["mistralai>=1.0.0"]
groq = ["groq>=0.9.0"]
bedrock = ["boto3>=1.28.0"]
litellm = ["litellm>=1.0.0"]
ollama = ["ollama>=0.4.0"]
langchain = ["langchain-core>=0.2.0"]
langgraph = ["langgraph>=0.1.0", "langchain-core>=0.2.0"]
pinecone = ["pinecone>=5.0.0"]
qdrant = ["qdrant-client>=1.9.0"]
chroma = ["chromadb>=0.5.0"]
weaviate = ["weaviate-client>=4.6.0"]
llamaindex = ["llama-index-core>=0.11.0"]
elevenlabs = ["elevenlabs>=1.4.0"]
assemblyai = ["assemblyai>=0.35.1"]
otel = ["opentelemetry-sdk>=1.20.0", "opentelemetry-instrumentation>=0.41b0"]
# Install every supported integration at once:  pip install "syntropylabs-evalkit[all]"
all = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-genai>=0.3.0",
    "cohere>=5.0.0",
    "mistralai>=1.0.0",
    "groq>=0.9.0",
    "boto3>=1.28.0",
    "litellm>=1.0.0",
    "ollama>=0.4.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "pinecone>=5.0.0",
    "qdrant-client>=1.9.0",
    "chromadb>=0.5.0",
    "weaviate-client>=4.6.0",
    "llama-index-core>=0.11.0",
    "elevenlabs>=1.4.0",
    "assemblyai>=0.35.1",
]

[tool.hatch.build.targets.wheel]
packages = ["evalkit", "evalkit_cli"]
exclude = ["evalkit/**/*.py", "evalkit_cli/**/*.py"]

[tool.hatch.build.targets.sdist]
only-include = ["evalkit", "evalkit_cli"]
include = ["/README.md", "/CHANGELOG.md", "/LICENSE"]
exclude = ["tests", "examples", ".claude", ".gitignore"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
