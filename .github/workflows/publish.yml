name: Publish Python SDK

# Publishes the EvalKit Python SDK to PyPI via Trusted Publishing (OIDC).
# No API token needed — GitHub and PyPI verify each other automatically.
#
# Triggers:
#   - Manually from the Actions tab ("Run workflow").
#   - Automatically when a tag like v0.1.0 is pushed.
#
# Requires a matching Trusted Publisher configured on PyPI:
#   Project name:  syntropylabs-evalkit
#   Owner:         Syntropylabs-ai
#   Repository:    evalkit_sdk_py
#   Workflow:      publish.yml
#   Environment:   prod

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write          # REQUIRED for Trusted Publishing (OIDC)

jobs:
  publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: prod        # must match the environment in the PyPI trusted publisher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install --upgrade build

      - name: Build wheel + sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
